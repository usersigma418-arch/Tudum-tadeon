services:
  - type: web
    name: jiosaaavn-bot
    env: python
    plan: standard
    buildCommand: |
      apt-get update && apt-get install -y ffmpeg fonts-dejavu-core
      pip install -r requirements.txt
    startCommand: python code_improved.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: PORT
        value: "10000"
